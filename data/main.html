<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Настройки</title>
  </head>
  <body>
    <form name="settings" action="" method="post" onsubmit="validate()">
      <div id="settingscontent"></div>
      <input type="submit" value="Submit" />
    </form>
    <br />
    <div>
      <input
        type="checkbox"
        id="accmag"
        name="accmag"
        onchange="toggleCheckbox(this)"
      />
      <label for="accmag">Read </label><b>ACC:</b>
      <div id="accvalue" style="display: inline"></div>
      <b>MAG:</b>
      <div id="magvalue" style="display: inline"></div>
    </div>
    <p><a href="/d3">Буфер данных</a></p>

    <div id="filecontent"></div>

    <script>
      var socket = new WebSocket("ws://" + location.host + "/ws");

      socket.onopen = function () {
        socket.send("id=");
      };

      socket.onmessage = function (e) {
        //console.log(e);
        res = e.data.split(";");
        acc = res[0].split(" ");
        mag = res[1].split(" ");
        document.getElementById("accvalue").innerHTML =
          acc[0] + ",&nbsp" + acc[1] + ",&nbsp" + acc[2] + "&nbsp";
        document.getElementById("magvalue").innerHTML =
          mag[0] + ",&nbsp" + mag[1] + ",&nbsp" + mag[2] + "&nbsp";
      };

      window.onload = function () {
        //console.log(document.readyState);
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
          if (this.readyState == 4 && this.status == 200) {
            document.getElementById("settingscontent").innerHTML =
              this.response;
            //console.log(this.response);
          }
        };
        xhttp.open("GET", "/menu", true);
        xhttp.send();
        xhttp.onload = function () {
          //console.log(document.getElementById("ip"));
          document.getElementById("ip").value = num2string(
            document.getElementById("ip").value
          );
        };

        var xhttp2 = new XMLHttpRequest();
        xhttp2.onreadystatechange = function () {
          if (this.readyState == 4 && this.status == 200) {
            document.getElementById("filecontent").innerHTML =
              this.response.replace(/(?:\r\n|\r|\n)/g, "<br>");
            //console.log(this.response);
          }
        };
        xhttp2.open("GET", "/data.csv", true);
        xhttp2.send();
      };

      function toggleCheckbox(element) {
        if (element.checked == true) {
          socket.send("id=" + element.name);
        } else {
          socket.send("id=");
        }
      }

      function validate() {
        document.getElementById("ip").value = string2num(
          document.getElementById("ip").value
        );
      }

      function num2string(ip) {
        return [24, 16, 8, 0].map((n) => (ip >> n) & 0xff).join(".");
      }

      function string2num(ip) {
        return ip
          .split(".")
          .reduce((sum, x, i) => sum + (x << (8 * (3 - i))), 0);
      }
    </script>
  </body>
</html>
