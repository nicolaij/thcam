<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/d3.min.js"></script>
    <script src="/x3dom.js"></script>
    <link rel="stylesheet" href="/x3dom.css" />
    <script src="/d3-x3d.min.js"></script>
  </head>

  <body>
    <div id="chartholder"></div>

    <script>
      var socket = new WebSocket("ws://" + location.host + "/ws");

      socket.onopen = function () {
        socket.send("id=accmag");
      };

      function loadChart(data) {
        // Select chartholder
        var chartHolder = d3.select("#chartholder");

        // Declare the chart component
        var myChart = d3.x3d.chart
          .particlePlot()
          .mappings({ x: "x", y: "y", z: "x", color: "color" });

        // Attach chart and data to the chartholder
        chartHolder.datum(data).call(myChart);
      }

      var myData = { key: "data", values: [] };

      socket.onmessage = function (e) {
        //console.log(e);
        res = e.data.split(";");
        acc = res[0].split(" ");
        mag = res[1].split(" ");

        myData.values.push({
          key: "ACC",
          values: [
            { key: "x", value: acc[0] },
            { key: "y", value: acc[1] },
            { key: "z", value: acc[2] },
            { key: "color", value: "#ff0d00" },
          ],
        });

        myData.values.push({
          key: "MAG",
          values: [
            { key: "x", value: mag[0] },
            { key: "y", value: mag[1] },
            { key: "z", value: mag[2] },
            { key: "color", value: "#0d00ff" },
          ],
        });

        //console.log(myData.values.length);

        if (myData.values.length % 100 == 0) {
          loadChart(myData);
        }
      };
    </script>
  </body>
</html>
