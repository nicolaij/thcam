<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>cube</title>

    <style>

      .cubecontainer {
        width: 200px;
        height: 200px;
        perspective: 400px;
        margin: 100px 100px 0;
        perspective-origin: center -100px ;
      }

      .cube {
        transform-style: preserve-3d;
        width: 100%;
        height: 100%;
        position: relative;
        animation: spin 10s infinite linear;
      }

      .face {
        position: absolute;
      }

      .top {
        transform: rotateX(90deg) translateZ(60px);
        background-color: rgb(35, 115, 161);
        width: 100%;
        height: 60%;
      }

      .sensor {
        transform: rotateX(90deg) translateZ(11px);
        border-radius: 33%;
        background: #ff0000;
        width: 20px;
        height: 20px;
        z-index: 1;
      }

      .bottom {
        transform: rotateX(-90deg) translateZ(20px);
        background-color: rgb(40, 90, 80);
        width: 100%;
        height: 60%;
      }

      .right {
        transform: rotateY(90deg) translateZ(140px);
        background-color: rgb(60, 90, 80);
        width: 60%;
        height: 40%;
      }

      .left {
        transform: rotateY(-90deg) translateZ(60px);
        background-color: rgb(80, 90, 80);
        width: 60%;
        height: 40%;
      }

      .front {
        transform: rotateX(0deg) translateZ(60px);
        background-color: rgb(100, 90, 80);
        width: 100%;
        height: 40%;
      }
      .back {
        transform: rotateX(-180deg) translateZ(60px);
        background-color: rgb(20, 90, 80);
        width: 100%;
        height: 40%;
      }

      @keyframes spin {
        from {
          transform: rotateX(0deg) rotateY(0deg);
        }
        to {
          transform: rotateX(-60deg) rotateY(360deg);
        }
      }

    </style>
  </head>
  <body>
    <div class="cubecontainer">
      <div class="cube">
        <div class="face front"></div>
        <div class="face sensor"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>
  </body>
</html>
